name: Upload to Gumroad

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      asset_url:
        description: 'ZIP file URL to upload to Gumroad'
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Get asset URL
        id: get_url
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            ASSET_URL=$(echo '${{ toJson(github.event.release.assets) }}' | \
              python3 -c "import sys,json; assets=json.load(sys.stdin); print(assets[0]['url'])")
          else
            ASSET_URL="${{ inputs.asset_url }}"
          fi
          echo "url=$ASSET_URL" >> $GITHUB_OUTPUT

      - name: Download ZIP
        run: |
          curl -L "${{ steps.get_url.outputs.url }}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o addon.zip

      - name: Upload to Gumroad
        run: |
          curl -X PUT "https://api.gumroad.com/v2/products/${{ secrets.GUMROAD_PRODUCT_ID }}" \
            -H "Authorization: Bearer ${{ secrets.GUMROAD_ACCESS_TOKEN }}" \
            -F "file=@addon.zip"
