name: Upload to Gumroad

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      asset_url:
        description: 'ZIP file URL to upload to Gumroad'
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Get asset URL
        id: get_url
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            ASSET_URL=$(echo '${{ toJson(github.event.release.assets) }}' | \
              python3 -c "import sys,json; assets=json.load(sys.stdin); print(assets[0]['url'])")
          else
            ASSET_URL="${{ inputs.asset_url }}"
          fi
          echo "url=$ASSET_URL" >> $GITHUB_OUTPUT

      - name: Download ZIP
        run: |
          curl -L "${{ steps.get_url.outputs.url }}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o addon.zip

      - name: Upload to Gumroad (presign flow)
        run: |
          PRESIGN=$(curl -s -X POST "https://api.gumroad.com/v2/files/presign" \
            -H "Authorization: Bearer ${{ secrets.GUMROAD_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"LegoIT.zip\", \"product_id\": \"${{ secrets.GUMROAD_PRODUCT_ID }}\"}")
          
          echo "Presign response: $PRESIGN"
          
          UPLOAD_URL=$(echo $PRESIGN | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['upload_url'])")
          FILE_URL=$(echo $PRESIGN | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['url'])")
          
          curl -X PUT "$UPLOAD_URL" \
            -H "Content-Type: application/zip" \
            --data-binary @addon.zip
          
          curl -s -X PUT "https://api.gumroad.com/v2/products/${{ secrets.GUMROAD_PRODUCT_ID }}" \
            -H "Authorization: Bearer ${{ secrets.GUMROAD_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"files\": [{\"url\": \"$FILE_URL\"}]}"
